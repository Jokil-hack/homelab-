services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    
    ports:
      - 8096:8096

    volumes:
      - ./config:/config
      - ./cache:/cache
      - /home/jokil/film:/media/movies:ro
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    

    ports:
      - 80:80
      

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - jellyfin 
       
    restart: unless-stopped  